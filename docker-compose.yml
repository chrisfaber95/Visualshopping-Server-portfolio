# Demo met de productcatalogus (db/), zonder Mollie en mail. Alleen bereikbaar via Tailscale.
services:
  db:
    image: mysql:8.0.41
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: cooplubbers_test
      MYSQL_USER: visualshopping
      MYSQL_PASSWORD: visualshopping-demo
    volumes:
      - db:/var/lib/mysql
      # Draait alleen bij een lege volume; opnieuw opbouwen: down, docker volume rm <project>_db, up (niet down -v: dat wist ook de foto's)
      - ./db:/docker-entrypoint-initdb.d:ro

  api:
    build: .
    restart: unless-stopped
    # Niet wachten tot de database gezond is: de eerste import duurt langer dan de 120 s die homelab-deploy op
    # `compose up --wait` wacht. Sequelize verbindt pas bij een verzoek; tijdens de import geven die een fout.
    depends_on:
      - db
    environment:
      PORT: "3001"
      DB_HOST: db
      DB_USER: visualshopping
      DB_PASS: visualshopping-demo
      DB_NAME: cooplubbers_test
      TOKEN_KEY: visualshopping-demo-token-key
      CRYPTR_KEY: visualshopping-demo-cryptr-key
      BASE_URL: http://homelab:8107/
      # Geen echte Mollie-sleutel: de server start, maar afrekenen geeft een fout. Mail staat uit (geen MAIL_USER).
      MOLLIE_API: test_demo-zonder-betalingen
      MOLLIE_TEST_API: test_demo-zonder-betalingen
    volumes:
      - public:/app/public
    ports:
      - "100.85.70.34:8106:3001"

volumes:
  db:
  public:
